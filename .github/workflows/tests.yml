name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: light-hub

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: light-hub
          toolchains: riscv64-zephyr-elf

      - name: Run Twister tests
        working-directory: light-hub
        run: west twister -T tests -p qemu_riscv32 -v --inline-logs