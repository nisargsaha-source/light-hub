CONFIG_QEMU_ICOUNT=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Logging (LOG_ERR/WRN/INF/DBG). Default level is INF, so LOG_DBG is hidden.
CONFIG_LOG=y
# Print logs right away in the caller's thread, so log lines and the
# typed-character echo come out in the right order with no delay.
CONFIG_LOG_MODE_IMMEDIATE=y
